<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Box</title>
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{--accent:#FF9500;--bg:#F2F2F7;--card:#fff;--label:#000;--sec:#8E8E93;--sep:#E5E5EA;--tint:rgba(255,149,0,.13)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--label);overscroll-behavior:none}
       background:radial-gradient(circle at 30% 20%,#fff4e6,#efe7dd 60%,#e4dcd2);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--label)}
  .side{max-width:280px;color:#5b4a3a;font-size:14px;line-height:1.5}
  .side h1{font-size:26px;margin:0 0 8px;color:#3a2a1a}
  .side kbd{background:#fff;border-radius:5px;padding:1px 6px;border:1px solid #d8cfc4;font-size:12px}
  @media (min-width:600px){body{background:#e9e4de}.screen{box-shadow:0 0 40px rgba(0,0,0,.08)}}
  .screen{position:fixed;inset:0;margin:0 auto;max-width:520px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}


  .views{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;background:var(--bg);scrollbar-width:none}
  .view::-webkit-scrollbar{display:none}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;min-height:44px;position:sticky;top:0;background:rgba(242,242,247,.92);backdrop-filter:blur(20px);z-index:3}
  .nav .btn{color:var(--accent);font-size:17px;background:none;border:0;padding:4px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit}
  .nav .center{font-weight:600;font-size:17px}
  .large{font-size:34px;font-weight:700;padding:0 16px 8px;letter-spacing:.3px}
  .search{margin:0 16px 10px;background:#E3E3E8;border-radius:10px;padding:8px 10px;display:flex;gap:6px;align-items:center;color:var(--sec)}
  .search input{border:0;background:none;outline:none;font-size:17px;flex:1;font-family:inherit}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;border:0;border-radius:99px;padding:8px 14px;font-weight:600;font-size:15px;background:#fff;cursor:pointer;font-family:inherit;color:#000}
  .chip.on{background:var(--accent);color:#fff}
  .chip.add{background:none;border:1.5px dashed rgba(255,149,0,.6);color:var(--accent)}
  .ghead{font-size:20px;font-weight:700;padding:14px 20px 6px}
  .shead{font-size:13px;color:var(--sec);text-transform:uppercase;padding:18px 32px 6px;display:flex;justify-content:space-between}
  .group{background:var(--card);border-radius:12px;margin:0 16px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;cursor:pointer;min-height:44px;font-size:17px}
  .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .row .chev{margin-left:auto;color:#C7C7CC;font-size:20px}
  .thumb{width:44px;height:44px;border-radius:10px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex-shrink:0}
  .rt{font-weight:600}
  .rs{font-size:12px;color:var(--sec);margin-top:2px}
  .tabbar{height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;display:flex;justify-content:space-around;padding-top:7px;background:rgba(249,249,249,.94);backdrop-filter:blur(20px);border-top:.5px solid #ccc;z-index:6}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#999;border:0;background:none;cursor:pointer;width:90px;position:relative;font-family:inherit}
  .tab.on{color:var(--accent)}
  .tab svg{width:26px;height:26px}
  .badge{position:absolute;top:-2px;left:52px;background:#FF3B30;color:#fff;border-radius:9px;font-size:12px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}

  .seg{display:flex;background:#E3E3E8;border-radius:9px;padding:2px}
  .seg button{border:0;background:none;padding:5px 14px;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;font-family:inherit}
  .seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .detail{padding:0 70px 40px 16px}
  .cat{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.5px;margin-top:6px}
  .dtitle{font-size:32px;font-weight:700;margin:4px 0 12px;line-height:1.1}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px}
  .stepper{display:flex;border-radius:8px;background:#E9E9EE;overflow:hidden}
  .stepper button{border:0;background:none;width:46px;height:32px;font-size:20px;cursor:pointer}
  .stepper button+button{border-left:1px solid #d1d1d6}
  .prim{width:100%;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:16px;border-radius:12px;padding:14px;cursor:pointer;font-family:inherit;margin-bottom:18px}
  .sec2{width:100%;border:0;background:var(--tint);color:var(--accent);font-weight:600;font-size:16px;border-radius:12px;padding:14px;cursor:pointer;font-family:inherit}
  .secname{font-size:22px;font-weight:700;margin:10px 0 10px}
  .lbl{color:var(--accent);font-weight:600;font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .ing{display:flex;gap:10px;align-items:baseline;padding:8px 0;cursor:pointer;font-size:16px}
  .ing+.ing{border-top:.5px solid var(--sep)}
  .ing .amt{font-weight:600;min-width:72px;font-variant-numeric:tabular-nums}
  .ing.done,.step.done{opacity:.4}
  .ing.done span{text-decoration:line-through}
  .circ{width:20px;height:20px;border-radius:50%;border:1.6px solid #C7C7CC;flex-shrink:0;position:relative;top:4px}
  .done .circ{background:var(--accent);border-color:var(--accent)}
  .step{display:flex;gap:12px;padding:6px 0;cursor:pointer;font-size:16px;line-height:1.4}
  .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step.done .num{background:#34C759}
  .rail{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:16px;background:rgba(255,255,255,.75);backdrop-filter:blur(14px);box-shadow:0 4px 14px rgba(0,0,0,.1);z-index:4}
  .rail button{width:50px;height:46px;border:0;border-radius:12px;background:var(--tint);color:var(--accent);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:700;font-family:inherit;overflow:hidden}
  .rail button.on{background:var(--accent);color:#fff}
  .rail svg{width:17px;height:17px}
  .rail .rg{display:flex;flex-direction:column;gap:4px;align-items:center}
  .rail .rg+.rg{margin-top:4px}
  .rail .rgn{font-size:9px;font-weight:700;color:var(--sec);max-width:50px;overflow:hidden;white-space:nowrap}
  .rail button.small{width:46px;height:36px}
  .sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.25)}
  .sheet.anim{animation:fade .2s}
  .sheet.anim .panel{animation:up .28s ease-out}
  .sheet .panel{background:var(--bg);border-radius:12px 12px 0 0;height:calc(100% - 20px - env(safe-area-inset-top));padding-bottom:env(safe-area-inset-bottom);overflow-y:auto;position:relative}
  @keyframes up{from{transform:translateY(100%)}}
  @keyframes fade{from{background:rgba(0,0,0,0)}}
  #imp{width:100%;height:330px;border:0;border-radius:14px;padding:14px;font-size:16px;font-family:inherit;resize:none;outline:none;line-height:1.4}
  .hint{font-size:13px;color:var(--sec);margin:10px 4px 12px;line-height:1.4}
  .two{display:flex;gap:10px}
  .two button{flex:1}
  .input{border:0;outline:none;font-size:17px;flex:1;font-family:inherit;background:none;min-width:0}
  .toast{position:absolute;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:30;white-space:nowrap;animation:fade .2s}
  .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#FF9500,#FF2D55);color:#fff;font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .toggle{width:51px;height:31px;border-radius:16px;background:#E9E9EA;position:relative;cursor:pointer;margin-left:auto;transition:.2s;flex-shrink:0}
  .toggle::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
  .toggle.on{background:#34C759}
  .toggle.on::after{left:22px}
  .val{margin-left:auto;color:var(--sec)}
  .red{color:#FF3B30}
  .acc{color:var(--accent)}
  .foot{font-size:13px;color:var(--sec);padding:6px 32px 0;line-height:1.35}
  .empty{text-align:center;color:var(--sec);padding:60px 30px}
  .del{margin-left:auto;color:#FF3B30;background:none;border:0;font-size:15px;cursor:pointer;font-family:inherit}
  .gcheck{width:24px;height:24px;border-radius:50%;border:1.8px solid #C7C7CC;flex-shrink:0}
  .gdone .gcheck{background:var(--accent);border-color:var(--accent)}
  .gdone .gname{text-decoration:line-through;color:var(--sec)}
  .gamt{margin-left:auto;color:var(--sec);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rev .rowi{display:flex;gap:8px;padding:8px 0;font-size:15px;border-top:.5px solid var(--sep)}
  .rev .rowi:first-of-type{border-top:0}
  .lhead{font-size:17px}
  .chevr{color:var(--accent);font-weight:700;font-size:20px;display:inline-block;transition:transform .2s;width:12px}
  .chevr.down{transform:rotate(90deg)}
  .lcount{background:var(--accent);color:#fff;font-weight:600;font-size:13px;border-radius:99px;padding:2px 9px}
  .lcount.ok{background:rgba(52,199,89,.15);color:#34C759}
  .lmenu{border:0;background:none;color:var(--sec);font-size:15px;cursor:pointer;letter-spacing:1px;padding:4px}
  .lacts{display:flex;gap:8px;padding:0 16px 12px}
  .lacts button{flex:1;border:0;border-radius:9px;background:#F2F2F7;padding:8px 4px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#000}
  .lacts button.red{color:#FF3B30}
  .ed input,.ed select,.ed textarea{font-family:inherit;font-size:16px;border:0;outline:none;background:#F2F2F7;border-radius:8px;padding:8px;color:#000;min-width:0}
  .ed .irow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .ed .amtin{width:58px;text-align:right}
  .ed .unitsel{width:66px;padding:8px 2px}
  .ed .namein{flex:1}
  .ed textarea{flex:1;height:auto;resize:none;line-height:1.35}
  .ed .x{border:0;background:none;color:#C7C7CC;font-size:18px;cursor:pointer;padding:4px}
  .ed .addb{border:0;background:none;color:var(--accent);font-weight:600;font-size:15px;cursor:pointer;padding:6px 0;font-family:inherit}
  .ed .secin{font-weight:700;font-size:18px;width:100%;background:none;padding:4px 0}
  .ed .sub{font-size:13px;color:var(--sec);text-transform:uppercase;margin:12px 0 6px}
  .pill{font-size:11px;background:var(--tint);color:var(--accent);padding:2px 8px;border-radius:99px;font-weight:700}
</style>
</head>

  <div class="views" id="views"></div>
  <div class="tabbar" id="tabbar"></div>
</div>

<script>
// JS port of UnitConverter.swift + RecipeParser.swift (same rules) for the browser preview.
const Core = (() => {
  const GRAMS_PER_CUP = [
    [["almond flour","almond meal","ground almonds"],96],[["coconut flour"],112],[["bread flour"],127],
    [["whole wheat flour","wholemeal flour"],120],[["cake flour"],114],[["flour"],125],
    [["brown sugar"],213],[["powdered sugar","icing sugar","confectioners"],120],[["coconut sugar"],150],[["sugar"],200],
    [["cocoa"],85],[["cornstarch","corn starch"],128],[["peanut butter","almond butter","nut butter"],256],[["butter","margarine"],227],[["shortening"],191],[["coconut oil"],218],
    [["honey","maple syrup","molasses","corn syrup","golden syrup"],340],
    [["rolled oats","oats","oatmeal"],90],[["chocolate chips","chocolate chunks","chopped chocolate","chips"],170],
    [["cream cheese"],232],[["sour cream","greek yogurt","yogurt","yoghurt"],245],[["ricotta"],246],[["mascarpone"],240],
    [["parmesan"],100],[["shredded cheese","grated cheese","cheddar","mozzarella","cheese"],113],
    [["shredded coconut","desiccated coconut","coconut flakes"],85],[["raisins","cranberries","dried fruit"],150],
    [["walnuts","pecans","hazelnuts"],120],[["almonds","peanuts","cashews","nuts"],140],
    [["breadcrumbs","bread crumbs","panko"],110],[["cracker crumbs","cookie crumbs","crumbs"],100],[["rice"],185],[["quinoa"],170],[["lentils"],200],[["salt"],288],
    [["baking soda","baking powder"],220],[["blueberries","raspberries","berries"],150],[["strawberries"],150],
    [["pumpkin puree","pumpkin"],245],[["banana"],225],[["applesauce","apple sauce"],250],[["jam","jelly","preserves"],320],[["nutella"],296],
  ];
  const LIQUIDS = ["milk","water","cream","buttermilk","juice","oil","stock","broth","wine","coffee","tea","vinegar","liqueur","rum","beer","sauce","extract"];
  const NOT_LIQUID = ["cream cheese","sour cream","ice cream","chocolate","chips","milk powder","powdered milk","coconut oil"];

  function gramsPerCup(name) {
    const l = name.toLowerCase();
    const word = k => new RegExp("(^|[^a-z])" + k + "s?($|[^a-z])").test(l);
    if (LIQUIDS.some(word) && !NOT_LIQUID.some(k => l.includes(k))) return null;
    if (l.includes("coconut oil")) return 218;
    for (const [keys, g] of GRAMS_PER_CUP) if (keys.some(k => l.includes(k))) return g;
    return null;
  }
  function roundMetric(v) {
    if (v < 10) return Math.round(v * 2) / 2;
    if (v < 100) return Math.round(v);
    if (v < 1000) return Math.round(v / 5) * 5;
    return Math.round(v / 10) * 10;
  }
  function toMetric(amount, unit, name) {
    if (amount == null) return [null, unit];
    switch (unit) {
      case "cup": { const d = gramsPerCup(name); return d ? [roundMetric(amount * d), "g"] : [roundMetric(amount * 240), "ml"]; }
      case "oz": return [roundMetric(amount * 28.35), "g"];
      case "lb": return [roundMetric(amount * 453.6), "g"];
      case "fl oz": return [roundMetric(amount * 29.57), "ml"];
      default: return [amount, unit];
    }
  }
  function num(v, maxDec = 1) { const f = Math.pow(10, maxDec); return String(Math.round(v * f) / f); }
  function fraction(v, thirds = true) {
    let opts = [[0,""],[0.125,"⅛"],[0.25,"¼"],[0.5,"½"],[0.75,"¾"],[1,""]];
    if (thirds) opts = opts.concat([[1/3,"⅓"],[2/3,"⅔"]]);
    if (v >= 10) return num(Math.round(v));
    const whole = Math.floor(v), rest = v - whole;
    let best = opts[0]; for (const o of opts) if (Math.abs(o[0] - rest) < Math.abs(best[0] - rest)) best = o;
    if (Math.abs(best[0] - rest) > 0.07) return num(v, 2);
    const w = whole + (best[0] === 1 ? 1 : 0);
    if (!best[1]) return String(w);
    return w === 0 ? best[1] : `${w} ${best[1]}`;
  }
  function formatMetric(v, unit) {
    switch (unit) {
      case "g": return v >= 1000 ? `${num(v/1000,2)} kg` : `${num(roundMetric(v))} g`;
      case "ml": return v >= 1000 ? `${num(v/1000,2)} l` : `${num(roundMetric(v))} ml`;
      case "kg": case "l": case "dl": return `${num(v,2)} ${unit}`;
      case "tsp": case "tbsp": case "cup": return `${fraction(v)} ${unit}`;
      case "pinch": return v === 1 ? "1 pinch" : `${fraction(v)} pinches`;
      case "pc": return `${fraction(v)} pc`;
      case "": return fraction(v);
      default: return `${num(v,2)} ${unit}`;
    }
  }
  function spoonsOrCups(cups) {
    if (cups >= 0.24) return `${fraction(cups)} ${cups > 1.01 ? "cups" : "cup"}`;
    const tbsp = cups * 16;
    if (tbsp >= 1) return `${fraction(tbsp)} tbsp`;
    return `${fraction(tbsp * 3)} tsp`;
  }
  function formatUS(v, unit, name) {
    if (unit === "g" || unit === "kg") {
      const g = unit === "kg" ? v * 1000 : v; const d = gramsPerCup(name);
      if (d) return spoonsOrCups(g / d);
      const oz = g / 28.35; if (oz >= 16) return `${num(oz/16,2)} lb`;
      return `${fraction(oz,false)} oz`;
    }
    if (unit === "ml" || unit === "dl" || unit === "l") {
      const ml = unit === "l" ? v * 1000 : unit === "dl" ? v * 100 : v; return spoonsOrCups(ml / 240);
    }
    if (unit === "cup") return spoonsOrCups(v);
    return formatMetric(v, unit);
  }
  function format(amount, unit, name, system, scale = 1) {
    if (amount == null) return unit || "";
    const v = amount * scale;
    if (system === "metric") { const [a, u] = toMetric(v, unit, name); return formatMetric(a ?? v, u); }
    return formatUS(v, unit, name);
  }
  function celsius(f) { return Math.round(((f - 32) * 5 / 9) / 10) * 10; }
  function fahrenheit(c) { const f = c * 9 / 5 + 32, q = Math.round(f / 25) * 25; return Math.abs(q - f) <= 8 ? q : Math.round(f / 5) * 5; }
  function metricText(t) {
    t = t.replace(/(\d+(?:\.\d+)?)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(?:-|\s)?(?:inches|inch|in\.|”|")/g, (_, a, b) => `${Math.round(a*2.54)}×${Math.round(b*2.54)} cm`);
    t = t.replace(/(\d+(?:\.\d+)?)\s*(?:-|\s)?(?:inches|inch|in\.|”)/g, (_, a) => { const cm = a * 2.54; return cm < 5 ? `${num(cm,1)} cm` : `${Math.round(cm)} cm`; });
    t = t.replace(/(\d{2,3})\s*(?:°|º|degrees?)?\s*(?:F\b|Fahrenheit)/g, (_, f) => `${celsius(+f)} °C`);
    return t;
  }
  function usText(t) { return t.replace(/(\d{2,3})\s*°\s*C\b/g, (_, c) => `${fahrenheit(+c)} °F`); }

  // ---------- Parser ----------
  const UNIT_ALIASES = [
    [["T","Tbs","Tbsp","TB"],"tbsp",true],[["t"],"tsp",true],
    [["fluid ounces","fluid ounce","fl. oz.","fl. oz","fl oz","floz"],"fl oz",false],
    [["cups","cup","c."],"cup",false],[["tablespoons","tablespoon","tbsp.","tbsp","tbs.","tbs","el"],"tbsp",false],
    [["teaspoons","teaspoon","tsp.","tsp","tl"],"tsp",false],[["ounces","ounce","oz.","oz"],"oz",false],
    [["pounds","pound","lbs.","lbs","lb.","lb"],"lb",false],[["kilograms","kilogram","kg"],"kg",false],
    [["grams","gram","gr.","gr","g"],"g",false],[["milliliters","millilitres","milliliter","millilitre","ml"],"ml",false],
    [["deciliters","decilitres","deciliter","decilitre","dl"],"dl",false],[["liters","litres","liter","litre","l"],"l",false],
    [["pinches","pinch"],"pinch",false],
  ];
  const UFRAC = {"½":.5,"⅓":1/3,"⅔":2/3,"¼":.25,"¾":.75,"⅕":.2,"⅖":.4,"⅗":.6,"⅘":.8,"⅙":1/6,"⅚":5/6,"⅛":.125,"⅜":.375,"⅝":.625,"⅞":.875};
  const ING_H = ["ingredients","ingredient list","you will need","what you need","zutaten"];
  const INS_H = ["instructions","directions","method","preparation","steps","how to make it","how to make","procedure","zubereitung"];
  const IGN_H = ["notes","note","nutrition","tips","equipment"];
  const isLetter = c => /\p{L}/u.test(c);

  function parseAmount(text) {
    const chars = Array.from(text).map(c => c === "⁄" ? "/" : c);
    let i = 0, total = 0, found = false;
    const skip = () => { while (i < chars.length && chars[i] === " ") i++; };
    const readNum = () => { const s = i; while (i < chars.length && /[0-9.,]/.test(chars[i])) i++; if (i === s) return null; const v = parseFloat(chars.slice(s, i).join("").replace(",", ".")); return isNaN(v) ? null : v; };
    for (let k = 0; k < 2; k++) {
      skip();
      if (i < chars.length && UFRAC[chars[i]] != null) { total += UFRAC[chars[i]]; i++; found = true; continue; }

const groceryName = n => n.split(",")[0].replace(/\s*\([^)]*\)/g, "").trim();
function addGroceries(id) {
  if (D.lists.length > 1) { st.sheet = "pickList"; st.pickFor = id; render(); return; }
  if (!D.lists.length) D.lists.push({ id: uid(), name: "Groceries", open: true, items: [] });

}
function addToList(recipeID, listID) {
  const r = D.recipes.find(x => x.id === recipeID), l = D.lists.find(x => x.id === listID);
  let added = 0;
  for (const s of r.sections) for (const i of s.ingredients) {
    const name = groceryName(i.name); if (!name) continue;
    const ex = l.items.find(g => !g.checked && g.name.toLowerCase() === name.toLowerCase());
    if (ex) { if (!ex.source) ex.source = r.title; else if (!ex.source.includes(r.title)) ex.source += ", " + r.title; }
    else { l.items.push({ id: uid(), name, checked: false, source: r.title }); added++; }
  }
  l.open = true; st.sheet = null; save(); render();
  toast(added ? `Added ${added} items to “${l.name}”` : `Already on “${l.name}”`);
}
function groceryView() {

      : `<div class="row lhead" onclick="toggleList('${l.id}')"><span class="chevr ${l.open ? "down" : ""}">›</span><b style="flex:1">${esc(l.name)}</b>${count}<button class="lmenu" onclick="event.stopPropagation();st.listMenu=st.listMenu==='${l.id}'?null:'${l.id}';render()">•••</button></div>`;
    const menu = st.listMenu === l.id ? `<div class="lacts"><button onclick="st.listMenu=null;st.renamingList='${l.id}';render();const r=$('#lren');r.focus();r.select()">Rename</button><button onclick="st.listMenu=null;shareText([D.lists.find(x=>x.id==='${l.id}').name].concat(D.lists.find(x=>x.id==='${l.id}').items.filter(g=>!g.checked).map(g=>'• '+g.name)).join('\n'))">Share</button><button onclick="clearDone('${l.id}')">Clear checked</button><button class="red" onclick="if(st.confirm==='dl${l.id}'){delList('${l.id}')}else{st.confirm='dl${l.id}';render()}">${st.confirm === "dl" + l.id ? "Tap to confirm" : "Delete list"}</button></div>` : "";

    return `<div class="group" style="margin-bottom:14px">${head}${menu}${body}</div>`;
  };
  return `<div class="nav"><span></span><span></span><button class="btn" onclick="st.sheet='newList';render();setTimeout(()=>$('#nl')&&$('#nl').focus(),50)">${ICON.plus}</button></div>
    <div class="large">Grocery Lists</div>
    ${D.lists.map(list).join("") || `<div class="empty"><div style="font-size:40px">🛒</div><b>No grocery lists</b><br>Tap ＋ to start a list.</div>`}
    <div class="foot" style="padding-top:0">Tap a list's name to open or close it.</div><div style="height:30px"></div>`;
}

function toggleG(lid, id) { const g = findL(lid).items.find(x => x.id === id); g.checked = !g.checked; save(); render(); }
function delG(lid, id) { const l = findL(lid); l.items = l.items.filter(x => x.id !== id); save(); render(); }
function addG(lid) { const inp = $("#in-" + lid), v = inp.value.trim(); if (!v) return; findL(lid).items.push({ id: uid(), name: v, checked: false }); save(); render(); $("#in-" + lid).focus(); }
function clearDone(lid) { const l = findL(lid); l.items = l.items.filter(g => !g.checked); st.listMenu = null; save(); render(); }
function delList(lid) { D.lists = D.lists.filter(l => l.id !== lid); st.listMenu = null; st.confirm = null; save(); render(); }
function renameList(lid, n) { const l = findL(lid); st.renamingList = null; if (l && n.trim()) l.name = n.trim(); save(); render(); }
function newList(name) { const l = { id: uid(), name: (name || "").trim() || "New list", open: true, items: [] }; D.lists.push(l); save(); return l; }

function addCat() { const v = $("#cin").value.trim(); if (v && !D.categories.some(c => c.name.toLowerCase() === v.toLowerCase())) D.categories.push({ id: uid(), name: v }); save(); render(); const i = $("#cin"); i && i.focus(); }
function delCat(id) { D.categories = D.categories.filter(c => c.id !== id); D.recipes.forEach(r => { if (r.categoryID === id) r.categoryID = null; }); if (st.filter === id) st.filter = "all"; save(); render(); }
function renameCat(id, n) { const c = D.categories.find(x => x.id === id); st.renaming = null; if (c && n && n.trim()) c.name = n.trim(); save(); render(); }
function moveCat(i, d) { const j = i + d; if (j < 0) return; [D.categories[i], D.categories[j]] = [D.categories[j], D.categories[i]]; save(); render(); }

const UNITS = ["", "g", "kg", "ml", "dl", "l", "tsp", "tbsp", "pinch", "pc", "cup", "oz", "lb", "fl oz"];
const amountToText = a => a == null ? "" : Core.fraction(a);
function toDraft(r) {
  return { id: r.id, isNew: !D.recipes.some(x => x.id === r.id), title: r.title, categoryID: r.categoryID || null, servings: r.servings || 4, favorite: !!r.favorite, notes: r.notes || "",

      ingredients: s.ingredients.map(i => ({ amountText: amountToText(i.amount), unit: i.unit || "", name: i.name })) })) };
}
function openEditor(id) {
  const filterCat = st.filter !== "all" && st.filter !== "fav" ? st.filter : null;
  const r = id ? D.recipes.find(x => x.id === id) : { id: uid(), title: "", categoryID: filterCat, servings: 4, sections: [{ id: uid(), name: "", ingredients: [{ amount: null, unit: "", name: "" }], steps: [""] }] };
  st.draft = toDraft(r); st.editTitle = id ? "Edit Recipe" : "New Recipe"; st.sheet = "edit"; st.confirm = null; render();

function convert() {

  st.draft = toDraft(p); st.editTitle = "Check & Save"; st.sheet = "edit"; render();
}

}

  render();
}
function cancelEdit() { st.sheet = null; st.draft = null; st.addingCat = false; st.confirm = null; render(); }
function saveDraft() {
  const d = ed();
  if (!d.title.trim()) { toast("Please give the recipe a title"); $("#ed-title").focus(); return; }
  const sections = d.sections.map(s => ({ id: s.id, name: s.name.trim(),
    ingredients: s.ingredients.filter(i => i.name.trim()).map(i => {
      const parsed = Core.parseAmount(i.amountText.trim()); const [amount, unit] = Core.toMetric(parsed ? parsed[0] : null, i.unit, i.name.trim());
      return { amount, unit: unit === "pinch" && amount == null ? "pinch" : unit, name: Core.metricText(i.name.trim()) }; }),
    steps: s.steps.map(t => Core.metricText(t.trim())).filter(Boolean) }))
    .filter(s => s.ingredients.length || s.steps.length || s.name);
  const r = { id: d.id, title: d.title.trim(), categoryID: d.categoryID, servings: d.servings, favorite: d.favorite, notes: d.notes.trim(), sections: sections.length ? sections : [{ id: uid(), name: "", ingredients: [], steps: [] }] };
  const idx = D.recipes.findIndex(x => x.id === r.id);
  if (idx >= 0) D.recipes[idx] = r; else D.recipes.push(r);
  save(); st.sheet = null; st.draft = null; st.importText = ""; st.tab = "recipes";
  st.stack = []; openRecipe(r.id); toast(idx >= 0 ? "Changes saved" : "Recipe saved");
}

// ---------- sharing, backup, screen ----------
function recipeText(id) {
  const r = D.recipes.find(x => x.id === id), scale = (st.servings || r.servings) / r.servings;
  const out = [r.title, `${st.servings || r.servings} servings`, ""];
  for (const s of r.sections) {
    if (s.name) out.push(s.name.toUpperCase());
    for (const i of s.ingredients) out.push(`• ${fmt(i, scale)} ${i.name}`.replace("•  ", "• "));
    s.steps.forEach((t, n) => out.push(`${n + 1}. ${st.units === "us" ? Core.usText(t) : t}`));
    out.push("");
  }
  if (r.notes) out.push(r.notes);
  return out.join("\n");
}
async function shareText(text) {
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); } catch { toast("Sharing isn't available here"); }
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `recipe-box-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importBackup(input) {
  const f = input.files && input.files[0]; if (!f) return;
  f.text().then(t => {
    const data = JSON.parse(t);
    if (!Array.isArray(data.recipes) || !Array.isArray(data.categories)) throw new Error("bad");
    data.lists = Array.isArray(data.lists) ? data.lists : [];
    data.settings = Object.assign({ name: "", units: "metric", awake: true }, data.settings || {});
    D = data; save(); st.stack = []; render(); toast(`Restored ${D.recipes.length} recipes`);
  }).catch(() => toast("That file isn't a Recipe Box backup"));
  input.value = "";
}
let wakeLock = null;
async function updateWakeLock() {
  const want = st.tab === "recipes" && st.stack.length && D.settings.awake && document.visibilityState === "visible";
  try {
    if (want && !wakeLock && "wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
document.addEventListener("visibilitychange", updateWakeLock);
render();
</script>
